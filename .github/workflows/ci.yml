name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  checks:
    name: lint / types / tests (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync host environment from lockfile
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      - name: CLI smoke test
        run: uv run ethirun --help

  host-isolation:
    name: host environment isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync host environment from lockfile
        run: uv sync --locked

      - name: Assert no model runtime in the host environment
        run: |
          if uv pip list --format=freeze | grep -Eai '^(torch|torchaudio|transformers|accelerate|tokenizers|datasets|soundfile|librosa)'; then
            echo "::error::Model runtime detected in the host environment"
            exit 1
          fi
          echo "Host environment is clean of model runtimes."
